name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: false
          # Windows support is wired through a named-pipe IPC layer but has not
          # been exercised by a maintainer on real hardware yet.
          - os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked
