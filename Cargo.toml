[package]
name = "mfe-player"
version = "0.1.0"
edition = "2021"
description = "A plugin-driven, terminal-native music streaming player"
license = "MIT"

[dependencies]
anyhow = "1"
async-channel = "2.5.0"
crossterm = "0.29"
futures-lite = "2.6.1"
fuzzy-matcher = "0.3"
libc = "0.2"
mpris-server = "0.11.0"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
