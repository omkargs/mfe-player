[package]
name = "mfe-player"
version = "0.2.1"
edition = "2021"
description = "Music For Everyone — a plugin-driven, terminal-native music player that tells subscriptions to get lost"
license = "MIT"
readme = "README.md"
rust-version = "1.85"
repository = "https://github.com/omkargs/mfe-player"
homepage = "https://github.com/omkargs/mfe-player"
keywords = ["music", "tui", "terminal", "streaming", "mpv"]
categories = ["command-line-utilities", "multimedia"]
exclude = ["npm/**", "packaging/**", ".github/**", "assets/**", "install.sh"]

[dependencies]
anyhow = "1"
async-channel = "2.5.0"
crossterm = "0.29"
futures-lite = "2.6.1"
fuzzy-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
lofty = "0.25.5"
mpris-server = "0.11.0"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
