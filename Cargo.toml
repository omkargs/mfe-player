[package]
name = "mfe-player"
version = "0.3.0"
edition = "2021"
description = "Music For Everyone — a plugin-driven, terminal-native music player that tells subscriptions to get lost"
license = "MIT"
readme = "README.md"
rust-version = "1.85"
repository = "https://github.com/omkargs/mfe-player"
homepage = "https://github.com/omkargs/mfe-player"
keywords = ["music", "tui", "terminal", "streaming", "mpv"]
categories = ["command-line-utilities", "multimedia"]
exclude = ["npm/**", "packaging/**", ".github/**", "assets/**", "install.sh"]

[dependencies]
anyhow = "1"
async-channel = "2.5.0"
crossterm = "0.29"
futures-lite = "2.6.1"
fuzzy-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25.5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.11.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "Win32",
    "Win32_System_WinRT",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-media-player = "0.3"
block2 = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
