<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="MFE Player — Music For Everyone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="0.55" stop-color="#10131b"/>
      <stop offset="1" stop-color="#171021"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f94"/>
      <stop offset="1" stop-color="#ad8eff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cdcee"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="18" fill="none" stroke="#31384a" stroke-width="2"/>
  <circle cx="34" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="34" r="6" fill="#27c93f"/>
  <text x="100" y="39" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c5468">mfe ~ music for everyone</text>

  <g filter="url(#glow)">
    <text x="64" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="104" font-weight="700" fill="url(#pink)">MFE</text>
    <text x="338" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="104" font-weight="700" fill="#dee2ed">PLAYER</text>
  </g>

  <text x="66" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5cdcee">music for everyone</text>
  <text x="66" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#70798f">stream · queue · download · visualise · repeat forever</text>

  <g transform="translate(66 300)">
    <rect x="0" y="0" width="520" height="52" rx="10" fill="#161b24" stroke="#31384a"/>
    <text x="18" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ff5f94">▶</text>
    <text x="44" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#dee2ed">Get Lucky</text>
    <text x="138" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#70798f">Daft Punk</text>
    <text x="44" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c5468">2:13 / 4:08 · vol 70% · repeat all</text>
    <rect x="300" y="31" width="196" height="4" rx="2" fill="#31384a"/>
    <rect x="300" y="31" width="104" height="4" rx="2" fill="url(#cyan)"/>
  </g>

  <g transform="translate(640 300)">
    <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c5468">no account</text>
    <text x="0" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c5468">no telemetry</text>
    <text x="220" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c5468">no Electron</text>
    <text x="220" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c5468">no subscription</text>
    <text x="420" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7ee787">MIT licensed</text>
    <text x="420" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7ee787">12 themes</text>
  </g>

  <g transform="translate(950 120)">
    <rect x="0" y="0" width="270" height="150" rx="12" fill="#0e1219" stroke="#31384a"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c5468">queue</text>
    <text x="16" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#ff5f94">▶ Get Lucky</text>
    <text x="16" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#70798f">  Instant Crush</text>
    <text x="16" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#70798f">  Lose Yourself…</text>
    <text x="16" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#70798f">  One More Time</text>
    <g transform="translate(196 34)">
      <rect x="0" y="44" width="8" height="24" rx="4" fill="#ff5f94"/>
      <rect x="14" y="24" width="8" height="64" rx="4" fill="#5cdcee"/>
      <rect x="28" y="36" width="8" height="40" rx="4" fill="#ad8eff"/>
      <rect x="42" y="12" width="8" height="88" rx="4" fill="#7ee787"/>
      <rect x="56" y="48" width="8" height="16" rx="4" fill="#ffd166"/>
    </g>
  </g>

  <text x="1214" y="376" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c5468">github.com/omkargs/mfe-player</text>
</svg>
