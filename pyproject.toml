[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mfe-player"
version = "0.3.3"
description = "A plugin-driven terminal music player: mpv, ratatui, no subscription, no account."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Omkar" }]
keywords = ["music", "tui", "terminal", "player", "mpv"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.urls]
Homepage = "https://github.com/omkargs/mfe-player"
Repository = "https://github.com/omkargs/mfe-player"
Issues = "https://github.com/omkargs/mfe-player/issues"

[tool.maturin]
# The Rust binary itself is the wheel: pip, pipx and uv put `mfe-player` on
# PATH with no Python glue and no compiler on the user's machine.
bindings = "bin"
strip = true
